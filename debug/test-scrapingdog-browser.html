<!DOCTYPE html>
<html>
<head>
    <title>ScrapingDog API 浏览器测试</title>
    <meta charset="utf-8">
    <style>
        body { font-family: monospace; max-width: 1000px; margin: 20px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        input { padding: 8px; width: 300px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🐕 ScrapingDog API 浏览器测试工具</h1>
    
    <div class="test-section info">
        <h3>🎬 测试视频</h3>
        <input type="text" id="videoId" value="f9Uk56LvBB0" placeholder="输入YouTube视频ID">
        <button onclick="testVideo()">🧪 测试这个视频</button>
        <button onclick="testYourVideo()">🎯 测试您的问题视频</button>
    </div>
    
    <div class="test-section">
        <h3>📊 测试结果</h3>
        <div id="results"></div>
    </div>
    
    <div class="test-section">
        <h3>🔧 集成测试</h3>
        <button onclick="testWithVideoService()">🔗 测试与YouTube服务集成</button>
        <div id="integration-results"></div>
    </div>
    
    <script>
        const API_KEY = '68660c4306b4f8aafe2d25dd';
        const BASE_URL = 'https://api.scrapingdog.com/youtube/transcripts';
        
        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/watch\?.*v=([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/ // 直接的视频ID
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return match[1];
                }
            }
            
            return null;
        }
        
        function addResult(containerId, type, title, content) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = `<h4>${title}</h4><div>${content}</div>`;
            container.appendChild(div);
        }
        
        function clearResults(containerId = 'results') {
            document.getElementById(containerId).innerHTML = '';
        }
        
        async function testVideo() {
            const input = document.getElementById('videoId').value.trim();
            if (!input) {
                alert('请输入视频ID或URL');
                return;
            }
            
            // 从URL中提取视频ID
            const videoId = extractVideoId(input);
            if (!videoId) {
                alert('无法从输入中提取视频ID，请输入有效的YouTube URL或视频ID');
                return;
            }
            
            clearResults();
            addResult('results', 'info', '🚀 开始测试', 
                `输入: ${input}<br>提取的视频ID: ${videoId}`);
            
            try {
                const url = `${BASE_URL}?api_key=${API_KEY}&v=${videoId}`;
                console.log('请求URL:', url);
                
                const startTime = Date.now();
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'User-Agent': 'Mozilla/5.0 (compatible; HitClone/1.0)'
                    }
                });
                const endTime = Date.now();
                
                addResult('results', 'info', '📡 HTTP响应', 
                    `状态: ${response.status} ${response.statusText}<br>
                     响应时间: ${endTime - startTime}ms`);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('API响应数据:', data);
                    
                    addResult('results', 'success', '✅ API调用成功', 
                        `数据结构: ${JSON.stringify(Object.keys(data))}<br>
                         字幕条数: ${data.transcripts ? data.transcripts.length : '无'}`);
                    
                    if (data.transcripts && data.transcripts.length > 0) {
                        // 显示前几条字幕
                        const sample = data.transcripts.slice(0, 3).map(t => 
                            `${t.start}s: ${t.text}`
                        ).join('<br>');
                        
                        addResult('results', 'success', '📝 字幕内容样本', sample);
                        
                        // 尝试转换为SRT格式
                        const srtContent = convertToSRT(data.transcripts);
                        addResult('results', 'success', '🔄 SRT转换结果', 
                            `SRT长度: ${srtContent.length} 字符<br>
                             <details>
                                <summary>查看SRT内容</summary>
                                <pre>${srtContent.substring(0, 500)}...</pre>
                             </details>`);
                    } else {
                        addResult('results', 'error', '❌ 无字幕数据', 
                            '该视频可能没有可用的字幕');
                    }
                } else {
                    const errorText = await response.text();
                    addResult('results', 'error', '❌ API调用失败', 
                        `HTTP ${response.status}: ${errorText}`);
                }
                
            } catch (error) {
                console.error('测试出错:', error);
                addResult('results', 'error', '💥 测试出错', error.message);
            }
        }
        
        function testYourVideo() {
            document.getElementById('videoId').value = 'https://youtu.be/f9Uk56LvBB0?si=eXoUN5-IcZ6o3QOs';
            testVideo();
        }
        
        function convertToSRT(transcripts) {
            let srtContent = '';
            let index = 1;
            
            for (const item of transcripts) {
                const start = item.start || 0;
                const duration = item.duration || 3;
                const end = start + duration;
                const text = item.text || '';
                
                if (text.trim()) {
                    srtContent += `${index}\n`;
                    srtContent += `${formatTime(start)} --> ${formatTime(end)}\n`;
                    srtContent += `${text.trim()}\n\n`;
                    index++;
                }
            }
            
            return srtContent;
        }
        
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            const milliseconds = Math.floor((seconds % 1) * 1000);
            
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')},${milliseconds.toString().padStart(3, '0')}`;
        }
        
        async function testWithVideoService() {
            clearResults('integration-results');
            addResult('integration-results', 'info', '🔗 集成测试', '正在测试与YouTube数据服务的集成...');
            
            try {
                // 动态导入YouTube数据服务
                const videoId = 'f9Uk56LvBB0';
                const url = `https://youtu.be/${videoId}`;
                
                addResult('integration-results', 'info', '📞 调用YouTube服务', 
                    `正在分析URL: ${url}`);
                
                // 这里我们模拟调用过程，因为实际的服务可能需要完整的模块加载
                addResult('integration-results', 'info', '⚠️ 模拟测试', 
                    '由于模块依赖问题，这里仅显示理论流程：<br>' +
                    '1. YouTubeDataService.fetchVideoData() 被调用<br>' +
                    '2. 内部调用 fetchTranscriptViaAPI()<br>' +
                    '3. 使用浏览器环境的 _fetchTranscriptDirectBrowser()<br>' +
                    '4. 调用ScrapingDog API<br>' +
                    '5. 转换JSON为SRT格式<br>' +
                    '6. 返回给分析系统<br><br>' +
                    '根据我们的API测试，这个流程应该是正常工作的。');
                
            } catch (error) {
                addResult('integration-results', 'error', '❌ 集成测试失败', error.message);
            }
        }
        
        // 页面加载完成后自动测试
        window.onload = function() {
            console.log('🐕 ScrapingDog浏览器测试工具已加载');
        };
    </script>
</body>
</html>
