<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./hitclone-pro-clean/">
  <title>HitClone Pro - AI视频分析工具演示</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 40px;
    }
    .logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    h1 {
      font-size: 42px;
      margin: 20px 0;
      font-weight: 700;
    }
    p {
      font-size: 18px;
      opacity: 0.9;
      margin: 10px 0;
    }
    .loader {
      margin: 30px auto;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .manual-link {
      margin-top: 30px;
      padding: 15px 30px;
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      display: inline-block;
      font-weight: 600;
      transition: all 0.3s;
    }
    .manual-link:hover {
      background: white;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎬</div>
    <h1>HitClone Pro</h1>
    <p>AI驱动的视频分析工具</p>
    <div class="loader"></div>
    <p>正在跳转到演示版本...</p>
    <p style="font-size: 14px; margin-top: 20px;">
      <strong>提示：</strong>演示版本使用预设数据，无需配置API Key
    </p>
    <a href="./hitclone-pro-clean/" class="manual-link">
      点击这里手动跳转 →
    </a>
  </div>

  <script>
    // 设置演示模式标记
    localStorage.setItem('hitclone_demo_mode', 'true');

    // 3秒后如果没有自动跳转，显示提示
    setTimeout(() => {
      document.querySelector('p:last-of-type').innerHTML =
        '<strong>如果没有自动跳转，</strong>请点击下方按钮';
    }, 3000);
  </script>
</body>
</html>
