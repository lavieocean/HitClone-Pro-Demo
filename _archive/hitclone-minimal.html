<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HitClone Pro - AI视频分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);color:#fff;min-height:100vh;padding:20px}
.status{position:fixed;top:20px;right:20px;padding:8px 16px;background:#10b981;border-radius:8px;font-size:12px}
.container{max-width:800px;margin:0 auto;padding-top:60px}
.header{text-align:center;margin-bottom:40px}
.title{font-size:48px;font-weight:900;color:#DBFC53;margin:0 0 16px 0;text-shadow:0 0 30px rgba(219,252,83,0.5)}
.subtitle{font-size:18px;color:#aaa;margin:0}
.input-section{background:rgba(255,255,255,0.05);border-radius:16px;padding:32px;border:1px solid rgba(255,255,255,0.1);margin-bottom:32px}
.input-group{display:flex;gap:16px;margin-bottom:16px}
.url-input{flex:1;padding:16px 20px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:16px;outline:none}
.analyze-btn{padding:16px 32px;background:linear-gradient(135deg,#DBFC53,#A8E063);border:none;border-radius:8px;color:#000;font-weight:bold;cursor:pointer;transition:all 0.3s}
.analyze-btn:disabled{background:#666;cursor:not-allowed}
.help-text{font-size:14px;color:#888;text-align:center;margin:0}
.result{background:rgba(255,255,255,0.05);border-radius:16px;padding:32px;border:1px solid rgba(255,255,255,0.1);margin-top:32px}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.result-title{font-size:24px;color:#DBFC53;margin:0;display:flex;align-items:center;gap:8px}
.badge{padding:4px 12px;background:#10b981;border-radius:16px;font-size:12px}
.result-content{background:rgba(0,0,0,0.3);border-radius:8px;padding:20px;border:1px solid rgba(255,255,255,0.1)}
.result-text{color:#fff;font-size:14px;line-height:1.6;margin:0;white-space:pre-wrap;font-family:system-ui,sans-serif}
.ai-notice{margin-top:20px;padding:16px;background:rgba(219,252,83,0.1);border-radius:8px;font-size:14px;color:#DBFC53;margin:16px 0 0 0}
.features{margin-top:40px;text-align:center}
.features-title{color:#DBFC53;margin-bottom:16px}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.feature-card{padding:20px;background:rgba(255,255,255,0.05);border-radius:8px}
.feature-icon{font-size:24px;margin-bottom:8px}
.feature-title{margin:0 0 8px 0;color:#fff}
.feature-desc{margin:0;font-size:14px;color:#aaa}
.footer{font-size:12px;color:#666}
</style>
</head>
<body>
<div id="status" class="status">🏠 模拟模式</div>
<div class="container">
<div class="header">
<h1 class="title">HitClone Pro</h1>
<p class="subtitle">AI驱动的视频分析工具</p>
</div>

<div class="input-section">
<div class="input-group">
<input type="text" id="urlInput" class="url-input" placeholder="粘贴YouTube视频链接...">
<button onclick="analyze()" id="analyzeBtn" class="analyze-btn">🚀 开始分析</button>
</div>
<p class="help-text">支持YouTube视频URL · <span id="modeText">智能模拟模式</span></p>
</div>

<div id="resultSection" class="result" style="display:none">
<div class="result-header">
<h2 class="result-title"><span>📊</span>分析结果</h2>
<span id="resultBadge" class="badge">模拟数据</span>
</div>
<div class="result-content">
<pre id="resultText" class="result-text"></pre>
</div>
<div id="aiNotice" class="ai-notice" style="display:none">
✨ 这是通过真实Claude API生成的分析结果！您可以询问更多关于这个视频的问题。
</div>
</div>

<div class="features">
<h3 class="features-title">🔥 功能特色</h3>
<div class="features-grid">
<div class="feature-card">
<div class="feature-icon">🤖</div>
<h4 class="feature-title">智能AI分析</h4>
<p class="feature-desc" id="aiDesc">高质量模拟</p>
</div>
<div class="feature-card">
<div class="feature-icon">🧬</div>
<h4 class="feature-title">病毒传播分析</h4>
<p class="feature-desc">评估内容传播潜力</p>
</div>
<div class="feature-card">
<div class="feature-icon">⚡</div>
<h4 class="feature-title">即时反馈</h4>
<p class="feature-desc">快速获得分析结果</p>
</div>
</div>
<p class="footer">在Claude Artifacts环境中部署可获得真实AI分析能力</p>
</div>
</div>

<script>
// 检测API环境
const isArtifacts = !!(window?.claude?.complete);
const statusEl = document.getElementById('status');
const modeTextEl = document.getElementById('modeText');
const aiDescEl = document.getElementById('aiDesc');

if (isArtifacts) {
statusEl.textContent = '✅ Claude API';
statusEl.style.background = '#10b981';
modeTextEl.textContent = '真实AI分析';
aiDescEl.textContent = '真实Claude API';
} else {
statusEl.textContent = '🏠 模拟模式';
statusEl.style.background = '#3b82f6';
}

async function analyze() {
const urlInput = document.getElementById('urlInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const resultSection = document.getElementById('resultSection');
const resultText = document.getElementById('resultText');
const resultBadge = document.getElementById('resultBadge');
const aiNotice = document.getElementById('aiNotice');

const url = urlInput.value.trim();
if (!url) return;

analyzeBtn.disabled = true;
analyzeBtn.textContent = '分析中...';

try {
let result;
if (isArtifacts) {
// 真实Claude API调用
const response = await window.claude.complete({
prompt: `请分析YouTube视频: ${url}

返回JSON格式分析结果，包含：
1. 病毒传播潜力评分 (0-100)
2. 情感分析概要
3. 内容优化建议
4. 目标受众特征

请确保返回结构化的JSON数据。`,
max_tokens: 800,
temperature: 0.7
});

result = { ai: true, data: response };
resultBadge.textContent = '真实AI分析';
resultBadge.style.background = '#10b981';
aiNotice.style.display = 'block';
} else {
// 模拟分析
await new Promise(resolve => setTimeout(resolve, 1500));
result = {
ai: false,
data: JSON.stringify({
"病毒传播潜力": 85,
"情感分析": {
"主导情感": "兴奋/好奇",
"情感强度": "高",
"观众参与度": "强"
},
"优化建议": [
"加强开场吸引力",
"增加互动元素",
"优化标题描述"
],
"目标受众": "18-35岁科技爱好者",
"预期表现": "高于平均20-30%"
}, null, 2)
};
resultBadge.textContent = '模拟数据';
resultBadge.style.background = '#3b82f6';
aiNotice.style.display = 'none';
}

resultText.textContent = typeof result.data === 'string' ? result.data : JSON.stringify(result.data, null, 2);
resultSection.style.display = 'block';

} catch (error) {
resultText.textContent = '分析失败: ' + error.message;
resultSection.style.display = 'block';
resultBadge.textContent = '错误';
resultBadge.style.background = '#ef4444';
}

analyzeBtn.disabled = false;
analyzeBtn.textContent = '🚀 开始分析';
}

// 回车键支持
document.getElementById('urlInput').addEventListener('keypress', function(e) {
if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
