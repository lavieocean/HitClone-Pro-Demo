<!DOCTYPE html>
<html>
<head>
    <title>Gemini API 修复测试</title>
    <meta charset="utf-8">
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        select { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔧 Gemini API 修复测试</h1>
    
    <div class="section info">
        <h3>⚙️ 配置管理</h3>
        <button onclick="clearConfig()">🗑️ 清除localStorage配置</button>
        <button onclick="checkConfig()">🔍 检查当前配置</button>
        <button onclick="testConnection()">🧪 测试API连接</button>
        <br><br>
        <label>选择模型:</label>
        <select id="modelSelect">
            <option value="gemini-1.5-pro-002">Gemini 1.5 Pro (002) - 推荐</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (实验)</option>
        </select>
        <button onclick="updateModel()">📝 更新模型</button>
    </div>
    
    <div class="section">
        <h3>📊 测试结果</h3>
        <div id="results"></div>
    </div>
    
    <script>
        function addResult(type, title, content) {
            const container = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `section ${type}`;
            div.innerHTML = `<h4>${title}</h4><div>${content}</div>`;
            container.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // 清除localStorage配置
        function clearConfig() {
            localStorage.removeItem('hitclone-gemini-config');
            addResult('success', '✅ 配置已清除', '已清除localStorage中的Gemini配置，将使用默认配置');
        }
        
        // 检查当前配置
        function checkConfig() {
            clearResults();
            const config = localStorage.getItem('hitclone-gemini-config');
            
            if (config) {
                try {
                    const parsed = JSON.parse(config);
                    addResult('info', '📋 当前配置', `<pre>${JSON.stringify(parsed, null, 2)}</pre>`);
                } catch (e) {
                    addResult('error', '❌ 配置格式错误', e.message);
                }
            } else {
                addResult('info', '📋 配置状态', '未找到自定义配置，将使用默认配置:<br>' +
                    '• 模型: gemini-1.5-pro-002<br>' +
                    '• API密钥: AIzaSyBmkOUbFgXtZcmeQj7eEXWczvnDyf49GFg');
            }
        }
        
        // 更新模型
        function updateModel() {
            const selectedModel = document.getElementById('modelSelect').value;
            
            // 获取现有配置或创建新配置
            let config = {};
            const existing = localStorage.getItem('hitclone-gemini-config');
            if (existing) {
                config = JSON.parse(existing);
            } else {
                config = {
                    apiKey: 'AIzaSyBmkOUbFgXtZcmeQj7eEXWczvnDyf49GFg',
                    endpoint: 'https://generativelanguage.googleapis.com/v1/models/',
                    maxTokens: 10000,
                    temperature: 0.7
                };
            }
            
            config.model = selectedModel;
            localStorage.setItem('hitclone-gemini-config', JSON.stringify(config));
            
            addResult('success', '✅ 模型已更新', `已将模型更新为: ${selectedModel}`);
        }
        
        // 测试API连接
        async function testConnection() {
            clearResults();
            addResult('info', '🚀 开始连接测试', '正在测试Gemini API连接...');
            
            try {
                // 检查配置
                let config = {};
                const existing = localStorage.getItem('hitclone-gemini-config');
                if (existing) {
                    config = JSON.parse(existing);
                } else {
                    config = {
                        apiKey: 'AIzaSyBmkOUbFgXtZcmeQj7eEXWczvnDyf49GFg',
                        model: 'gemini-1.5-pro-002',
                        endpoint: 'https://generativelanguage.googleapis.com/v1/models/',
                        maxTokens: 10000,
                        temperature: 0.7
                    };
                }
                
                addResult('info', '📋 使用配置', `<pre>${JSON.stringify(config, null, 2)}</pre>`);
                
                // 构建API URL
                const apiUrl = `${config.endpoint}${config.model}:generateContent?key=${config.apiKey}`;
                
                addResult('info', '🔗 API调用地址', apiUrl.replace(config.apiKey, '***'));
                
                // 调用API
                const startTime = Date.now();
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: '请回复"连接测试成功"' }]
                        }],
                        generationConfig: {
                            maxOutputTokens: 20,
                            temperature: 0.1,
                            candidateCount: 1
                        }
                    })
                });
                
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                addResult('info', '📡 API响应', `状态: ${response.status} ${response.statusText}<br>响应时间: ${duration}ms`);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Gemini API响应数据:', data);
                    
                    if (data.candidates && data.candidates.length > 0) {
                        const candidate = data.candidates[0];
                        if (candidate.content && candidate.content.parts && candidate.content.parts.length > 0) {
                            const responseText = candidate.content.parts[0].text;
                            addResult('success', '✅ API测试成功', `响应内容: "${responseText}"`);
                            addResult('success', '🎉 修复确认', 'Gemini API现在可以正常工作了！');
                        } else {
                            addResult('error', '❌ 响应格式异常', `无法解析响应内容: ${JSON.stringify(data, null, 2)}`);
                        }
                    } else {
                        addResult('error', '❌ 无候选响应', `API返回了空的候选响应: ${JSON.stringify(data, null, 2)}`);
                    }
                } else {
                    const errorText = await response.text();
                    console.error('Gemini API错误:', errorText);
                    addResult('error', '❌ API调用失败', `${response.status}: ${errorText}`);
                    
                    // 尝试解析错误信息
                    try {
                        const errorData = JSON.parse(errorText);
                        if (errorData.error && errorData.error.message) {
                            addResult('error', '💡 错误详情', errorData.error.message);
                        }
                    } catch (e) {
                        // 忽略JSON解析错误
                    }
                }
                
            } catch (error) {
                console.error('测试连接失败:', error);
                addResult('error', '💥 网络错误', error.message);
            }
        }
        
        // 页面加载时显示说明
        window.onload = function() {
            addResult('info', '📋 使用说明', 
                '1. 点击"清除localStorage配置"清除旧的配置缓存<br>' +
                '2. 点击"检查当前配置"查看当前使用的API配置<br>' +
                '3. 选择合适的模型并点击"更新模型"<br>' +
                '4. 点击"测试API连接"验证修复效果<br><br>' +
                '🎯 目标：确认Gemini API不再出现404错误');
        };
    </script>
</body>
</html>
