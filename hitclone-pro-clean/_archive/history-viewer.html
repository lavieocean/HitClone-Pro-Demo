<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HitClone Pro - History Reports Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
        }
        .content {
            padding: 30px;
        }
        .channel-card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            background: #f9f9f9;
        }
        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .channel-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .video-count {
            background: #007AFF;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
        }
        .smart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .smart-button:hover {
            transform: scale(1.05);
        }
        .video-list {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }
        .video-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #007AFF;
        }
        .video-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .video-meta {
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 15px;
        }
        .score {
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid;
        }
        .info { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        .success { background: #e8f5e8; border-color: #4caf50; color: #1b5e20; }
        .warning { background: #fff3e0; border-color: #ff9800; color: #e65100; }
        .error { background: #ffebee; border-color: #f44336; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 HitClone Pro - History Reports</h1>
            <p>查看您的历史分析数据和智能频道分析功能</p>
        </div>
        
        <div class="content">
            <div id="status"></div>
            <div id="channel-analysis"></div>
            <div id="history-data"></div>
        </div>
    </div>

    <script>
        // 获取localStorage数据
        function getHistoryData() {
            try {
                const saved = localStorage.getItem('hitclone-analysis-history');
                return saved ? JSON.parse(saved) : [];
            } catch (error) {
                console.error('Error loading history:', error);
                return [];
            }
        }

        // 频道聚合分析
        function getChannelAggregation(historyReports) {
            const channelMap = new Map();
            historyReports.forEach(report => {
                const channel = report.channel || '未知频道';
                if (!channelMap.has(channel)) {
                    channelMap.set(channel, {
                        channel,
                        count: 0,
                        reports: [],
                        avgScore: 0,
                        totalViews: 0,
                        latestDate: null
                    });
                }
                const channelData = channelMap.get(channel);
                channelData.count++;
                channelData.reports.push(report);
                
                const reportDate = new Date(report.analysisDate);
                if (!channelData.latestDate || reportDate > channelData.latestDate) {
                    channelData.latestDate = reportDate;
                }
            });
            
            // 计算平均分
            channelMap.forEach((data, channel) => {
                const totalScore = data.reports.reduce((sum, report) => sum + (report.score || 0), 0);
                data.avgScore = Math.round(totalScore / data.count);
            });
            
            return Array.from(channelMap.values()).sort((a, b) => b.count - a.count);
        }

        // 获取评分颜色
        function getScoreColor(score) {
            if (score >= 90) return '#28a745';
            if (score >= 80) return '#20c997';  
            if (score >= 70) return '#ffc107';
            if (score >= 60) return '#fd7e14';
            return '#dc3545';
        }

        // Smart Channel Analysis功能
        function startSmartChannelAnalysis(channelData) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <div class="status success">
                    <strong>🧠 Smart Channel Analysis 已触发！</strong><br>
                    频道：${channelData.channel}<br>
                    视频数量：${channelData.count}<br>
                    平均评分：${channelData.avgScore}<br>
                    <small>在真实环境中，这将跳转到HitClone Channel页面进行深度分析</small>
                </div>
            `;
            
            // 模拟事件触发
            const channelVideos = channelData.reports.map(report => ({
                id: report.id,
                title: report.title,
                url: report.analysisResults?.contentInfo?.url || '#',
                analysisResults: report.analysisResults,
                analysisDate: report.analysisDate,
                score: report.score
            }));

            const channelAnalysisData = {
                channelName: channelData.channel,
                channelId: `smart_${channelData.channel}`,
                totalVideos: channelData.count,
                videos: channelVideos,
                source: 'smart_history_analysis',
                canAnalyze: true
            };

            console.log('🚀 Smart Channel Analysis Data:', channelAnalysisData);
            
            // 显示详细分析数据
            setTimeout(() => {
                statusDiv.innerHTML += `
                    <div class="status info">
                        <strong>📡 分析数据已准备完成：</strong><br>
                        <pre style="margin-top: 10px; font-size: 11px; background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto;">${JSON.stringify(channelAnalysisData, null, 2)}</pre>
                    </div>
                `;
            }, 1000);
        }

        // 页面初始化
        window.onload = function() {
            const historyReports = getHistoryData();
            const statusDiv = document.getElementById('status');
            const channelDiv = document.getElementById('channel-analysis');
            const historyDiv = document.getElementById('history-data');

            if (historyReports.length === 0) {
                statusDiv.innerHTML = `
                    <div class="status warning">
                        <strong>⚠️ 未找到历史分析数据</strong><br>
                        请先在HitClone Pro中分析一些视频，然后再访问此页面查看历史数据。
                    </div>
                `;
                return;
            }

            statusDiv.innerHTML = `
                <div class="status success">
                    <strong>✅ 成功加载历史数据</strong><br>
                    共找到 ${historyReports.length} 个分析报告
                </div>
            `;

            const channelAggregation = getChannelAggregation(historyReports);
            const eligibleChannels = channelAggregation.filter(channel => channel.count >= 3);

            // 显示频道分析
            channelDiv.innerHTML = `
                <h2>📺 按频道浏览 (${channelAggregation.length} 个频道)</h2>
                <div class="status info">
                    <strong>🧠 Smart Channel Analysis 条件：</strong> 频道需要有3个或以上的分析报告<br>
                    当前符合条件的频道：${eligibleChannels.length} 个
                </div>
                ${channelAggregation.map(channel => `
                    <div class="channel-card">
                        <div class="channel-header">
                            <span class="channel-name">📺 ${channel.channel}</span>
                            <span class="video-count">${channel.count} 个视频</span>
                        </div>
                        <div style="display: flex; gap: 20px; align-items: center; margin: 10px 0;">
                            <span>平均评分: <span class="score" style="background-color: ${getScoreColor(channel.avgScore)}">${channel.avgScore}</span></span>
                            <span>最新分析: ${channel.latestDate ? channel.latestDate.toLocaleDateString('zh-CN') : '未知'}</span>
                        </div>
                        ${channel.count >= 3 ? `
                            <button class="smart-button" onclick="startSmartChannelAnalysis(${JSON.stringify(channel).replace(/"/g, '&quot;')})">
                                🧠 Smart Channel Analysis
                            </button>
                        ` : '<p style="color: #999; margin: 10px 0;">需要3个或以上视频才能启用Smart Channel Analysis</p>'}
                        <div class="video-list">
                            ${channel.reports.map(report => `
                                <div class="video-item">
                                    <div class="video-title">${report.title}</div>
                                    <div class="video-meta">
                                        <span>评分: <span class="score" style="background-color: ${getScoreColor(report.score)}">${report.score}</span></span>
                                        <span>分析时间: ${new Date(report.analysisDate).toLocaleDateString('zh-CN')}</span>
                                        <span>类型: ${report.type === 'url' ? '🔗 URL' : '📄 SRT'}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            `;

            // 显示原始历史数据
            historyDiv.innerHTML = `
                <h2>📋 完整历史数据 (${historyReports.length} 条记录)</h2>
                <details style="margin-top: 15px;">
                    <summary style="cursor: pointer; font-weight: 600; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                        点击查看原始JSON数据
                    </summary>
                    <pre style="margin-top: 10px; font-size: 11px; background: #f8f9fa; padding: 15px; border-radius: 4px; overflow-x: auto; max-height: 400px; overflow-y: auto;">${JSON.stringify(historyReports, null, 2)}</pre>
                </details>
            `;
        };
    </script>
</body>
</html>
